name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIN_COVERAGE: 80

jobs:
  # the tests job runs `xcodebuild test`, which compiles first — a separate
  # build job would just duplicate that compile on the 10x-priced macOS runner.
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests with coverage
        run: |
          xcodebuild -scheme tt \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            test

      - name: Check application logic coverage
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          python3 scripts/check_coverage.py coverage.json
